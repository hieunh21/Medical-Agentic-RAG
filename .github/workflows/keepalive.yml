# Giữ bản demo không bị tắt vì "không hoạt động":
#   Qdrant Cloud free: tạm dừng sau 1 tuần không có request, xoá sau 4 tuần.
#   Hugging Face Space (ZeroGPU): ngủ sau 48 giờ không có request.
# Chạy mỗi ngày. /ping của Space không dùng GPU nên không tốn quota; count của Qdrant chỉ cần key chỉ đọc.
#
# Secrets cần thêm ở GitHub: Settings -> Secrets and variables -> Actions
#   QDRANT_URL, QDRANT_API_KEY (key chỉ đọc), HF_TOKEN (token chỉ đọc)
# Lưu ý: GitHub tự TẮT workflow theo lịch nếu repo public không có commit nào trong 60 ngày.
name: keep-alive

on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC mỗi ngày
  workflow_dispatch:        # chạy tay từ tab Actions để thử

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Qdrant Cloud (count, chỉ đọc)
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          curl -fsS -X POST "$QDRANT_URL/collections/youmed_medical/points/count" \
            -H "api-key: $QDRANT_API_KEY" -H "Content-Type: application/json" \
            -d '{"exact": false}'

      - name: Hugging Face Space (/ping, không dùng GPU)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install --quiet gradio_client==2.7.2
          python - <<'EOF'
          import os
          from gradio_client import Client
          print(Client("hhieu21/medrag-models", token=os.environ["HF_TOKEN"], verbose=False).predict("", api_name="/ping"))
          EOF
