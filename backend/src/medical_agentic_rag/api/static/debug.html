<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Debug — Medical Agentic RAG</title>
<style>
  :root {
    --bg: #f4f7fb; --card: #fff; --text: #162033; --muted: #667085; --line: #dbe4ef;
    --brand: #0f766e; --ok: #047857; --warn: #b45309; --danger: #b91c1c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  .row { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 1rem; }
  button { padding: 10px 18px; border: none; border-radius: 10px; background: var(--brand); color: #fff; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .examples { margin: 10px 0 20px; font-size: .85rem; color: var(--muted); }
  .examples button { background: #eef2ff; color: #3730a3; padding: 4px 10px; font-size: .8rem; margin: 2px 4px 2px 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-top: 16px; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .badge { padding: 4px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; background: #eef6f8; }
  .badge.sufficient { background: #ecfdf5; color: var(--ok); }
  .badge.partial { background: #fff7ed; color: var(--warn); }
  .badge.insufficient { background: #fef2f2; color: var(--danger); }
  .answer { white-space: pre-wrap; line-height: 1.6; }
  .sources li, .chunks li { margin: 6px 0; font-size: .9rem; }
  .chunks li { border-left: 3px solid var(--line); padding-left: 10px; }
  .chunk-meta { color: var(--muted); font-size: .78rem; }
  .chunk-text { color: #334; font-size: .85rem; margin-top: 2px; }
  details summary { cursor: pointer; font-weight: 600; margin-top: 10px; }
  .muted { color: var(--muted); font-size: .85rem; }
  .err { color: var(--danger); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Debug — Medical Agentic RAG (Phase 1+2)</h1>
  <div class="row">
    <input id="q" type="text" placeholder="Nhập câu hỏi y khoa..." />
    <button id="ask">Hỏi</button>
  </div>
  <div class="examples">
    Ví dụ:
    <button data-q="Bệnh Addison là gì?">Dễ</button>
    <button data-q="Hay bi dau dau khi dung day la bi gi?">Không dấu</button>
    <button data-q="Giá vàng hôm nay bao nhiêu?">Ngoài phạm vi</button>
  </div>

  <div id="out"></div>
</div>

<script>
const $ = (sel) => document.querySelector(sel);
const out = $("#out");
const input = $("#q");
const askBtn = $("#ask");

document.querySelectorAll(".examples button").forEach(b => {
  b.addEventListener("click", () => { input.value = b.dataset.q; ask(); });
});
askBtn.addEventListener("click", ask);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });

async function ask() {
  const question = input.value.trim();
  if (!question) return;
  askBtn.disabled = true;
  out.innerHTML = '<p class="muted">Đang chạy graph...</p>';
  try {
    const t0 = performance.now();
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const d = await res.json();
    render(d, performance.now() - t0);
  } catch (e) {
    out.innerHTML = `<p class="err">Lỗi: ${escapeHtml(String(e))}</p>`;
  } finally {
    askBtn.disabled = false;
  }
}

function render(d, clientMs) {
  const statusClass = d.evidence_status || "";
  const coverage = d.coverage != null ? d.coverage.toFixed(2) : "—";
  const sources = (d.sources || []).map(s =>
    `<li>[${s.n}] ${escapeHtml(s.title)} — <a href="${s.url}" target="_blank" rel="noopener">${s.url}</a></li>`
  ).join("") || '<li class="muted">(không có)</li>';

  const chunks = (d.context_chunks || []).map(c => `
    <li>
      <div class="chunk-meta">${escapeHtml(c.title)} · ${c.section_type} ${c.section_path && c.section_path.length ? "› " + c.section_path.map(escapeHtml).join(" › ") : ""} · score=${c.rerank_score != null ? c.rerank_score.toFixed(3) : "—"}</div>
      <div class="chunk-text">${escapeHtml(c.text)}${c.text && c.text.length >= 500 ? "…" : ""}</div>
    </li>`
  ).join("") || '<li class="muted">(không có)</li>';

  out.innerHTML = `
    <div class="card">
      <div class="badges">
        <span class="badge ${statusClass}">evidence_status: ${statusClass || "—"}</span>
        <span class="badge">coverage: ${coverage}</span>
        <span class="badge">n_relevant: ${d.n_relevant ?? "—"}</span>
        <span class="badge">corrections: ${d.corrections}</span>
        <span class="badge">llm_calls: ${d.llm_calls}</span>
        <span class="badge">server: ${d.elapsed_ms} ms · client: ${clientMs.toFixed(0)} ms</span>
      </div>
      ${d.missing_aspects && d.missing_aspects.length ? `<p class="muted">Khía cạnh còn thiếu: ${d.missing_aspects.map(escapeHtml).join(", ")}</p>` : ""}
      <div class="answer">${escapeHtml(d.answer)}</div>
      <details open>
        <summary>Nguồn (${(d.sources || []).length})</summary>
        <ul class="sources">${sources}</ul>
      </details>
      <details>
        <summary>Context chunks đưa vào prompt (${(d.context_chunks || []).length})</summary>
        <ul class="chunks">${chunks}</ul>
      </details>
    </div>`;
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}
</script>
</body>
</html>
